# ============================================================================
# BAZA COMUNA (dev + prod)
#
# Nu se ruleaza singur. Se combina mereu cu un overlay:
#   dev : docker compose -f docker-compose.yaml -f docker-compose.build.yml -f docker-compose.dev.yml --env-file .env up -d --build
#   prod: docker compose -f docker-compose.yaml -f docker-compose.prod.yml --env-file .env.prod --env-file .env.release up -d
# (scripturile din scripts/ fac asta pentru tine)
#
# Imaginile proprii (backend, frontend, python-ai, file-api, nginx) se numesc
# ${IMAGE_PREFIX}/<serviciu>:${IMAGE_TAG}. Aici nu exista `build:`: sectiunile
# de build sunt in docker-compose.build.yml (dev + scripts/release-build.sh).
# Pe VPS nu se construieste nimic; imaginile vin de pe PC (scripts/release-push.sh).
#
# Aici NU exista porturi publicate si nici valori specifice unui mediu
# (URL-uri publice, domeniu, comanda Keycloak, restart policy, logging).
# Fiecare container primeste explicit DOAR variabilele de care are nevoie
# (nu se mai foloseste env_file: .env, care ducea toate secretele peste tot).
# ${VAR:?} = variabila obligatorie; compose refuza sa porneasca daca lipseste.
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL - doua baze: ${DB_NAME} (aplicatia) + ${KEYCLOAK_DB_NAME}
  # Baza Keycloak e creata de postgres-init/script.sh (doar pe volum gol).
  # --------------------------------------------------------------------------
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:?}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------
  # Keycloak - comanda (start-dev / start) si hostname vin din overlay.
  # Realm-ul se importa automat din keycloak/realm-export.json la primul start
  # (placeholder-ele ${KEYCLOAK_*} din fisier sunt inlocuite din env).
  # --------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB_NAME:?}
      KC_DB_USERNAME: ${DB_USER:?}
      KC_DB_PASSWORD: ${DB_PASSWORD:?}
      # Admin-ul temporar din realm-ul master (creat doar la primul start)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # Nginx vorbeste cu Keycloak pe HTTP intern (TLS se termina in nginx)
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # /health/ready pe portul de management 9000 (folosit de healthcheck)
      KC_HEALTH_ENABLED: "true"
      # Folosite DOAR de importul realm-ului (placeholder-e in realm-export.json)
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      # Imaginea Keycloak nu are curl/wget -> request HTTP facut din bash
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ "$$line" == *" 200"* ]]'
      interval: 15s
      timeout: 5s
      retries: 10
      # Primul start (schema DB noua + import realm) poate depasi 90s pe un VPS mic
      start_period: 180s

  # --------------------------------------------------------------------------
  # RabbitMQ - hostname fix, altfel datele din volum (legate de numele
  # nodului rabbit@<hostname>) nu mai sunt gasite la recreare.
  # --------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # Stocare S3 (serviciul ramane "minio" in compose/config/cod).
  # Imaginile oficiale minio/minio nu mai sunt publicate (MinIO a oprit
  # distributia binarelor/imaginilor community). Folosim Silo, fork-ul
  # comunitar pgsty (fost pgsty/minio): aceleasi variabile MINIO_*, acelasi
  # format de date, API S3 identic. Include clientul `mcli` (folosit la backup).
  # Imaginea se poate schimba din MINIO_IMAGE.
  # --------------------------------------------------------------------------
  minio:
    image: ${MINIO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # Pentru scripturile de backup/restore (mcli alias + numele bucket-ului)
      MINIO_BUCKET: ${MINIO_BUCKET:?}
    volumes:
      - minio_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------
  # Backend .NET (FbiApi). Migratiile EF ruleaza automat la startup
  # (Database.Migrate()); daca migrarea esueaza, procesul se opreste.
  # --------------------------------------------------------------------------
  backend:
    image: ${IMAGE_PREFIX:-fbi}/backend:${IMAGE_TAG:-dev}
    environment:
      ASPNETCORE_URLS: "http://+:7002"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${DB_NAME:?};Username=${DB_USER:?};Password=${DB_PASSWORD:?}"
      Keycloak__Authority: http://keycloak:8080/realms/${KEYCLOAK_REALM:?}
      Keycloak__Url: http://keycloak:8080
      Keycloak__TokenUrl: http://keycloak:8080/realms/${KEYCLOAK_REALM:?}/protocol/openid-connect/token
      Keycloak__Realm: ${KEYCLOAK_REALM:?}
      Keycloak__ClientId: ${KEYCLOAK_CLIENT_ID:?}
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET:?}
      # Integrari nefolosite de feature-urile curente (pot ramane goale)
      Stripe__PublishableKey: ${STRIPE_PUB_KEY:-}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK:-}
      EmailSettings__SmtpServer: ${SMTP_SERVER:-}
      EmailSettings__Port: ${SMTP_PORT:-587}
      EmailSettings__Username: ${SMTP_USER:-}
      EmailSettings__Password: ${SMTP_PASS:-}
      Supabase__Url: ${SUPABASE_URL:-}
      Supabase__Key: ${SUPABASE_KEY:-}
      FaceRecognition__Url: http://python-ai:8006
      FaceRecognition__ApiKey: ${FACE_RECOG_API_KEY:?}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:?}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?}
      RabbitMq__Queue: ${RABBITMQ_QUEUE_ANALYSIS:?}
      RabbitMq__ReceiveQueue: ${RABBITMQ_QUEUE_FINISHED:?}
      Scraper__RunAtStartup: ${SCRAPER_RUN_AT_STARTUP:-auto}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migratiile EF ruleaza inainte ca API-ul sa raspunda (la primul start: toata schema)
      start_period: 120s

  # --------------------------------------------------------------------------
  # Frontend Next.js. NEXT_PUBLIC_* sunt BUILD ARGS (ajung in bundle-ul JS,
  # vezi docker-compose.build.yml): orice schimbare cere rebuild
  # (dev: scripts/dev-up.sh frontend; prod: release-build + release-push).
  # --------------------------------------------------------------------------
  frontend:
    image: ${IMAGE_PREFIX:-fbi}/frontend:${IMAGE_TAG:-dev}
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # Serviciul AI (DeepFace). Scrie direct in tabelele EF din Postgres.
  # --------------------------------------------------------------------------
  python-ai:
    image: ${IMAGE_PREFIX:-fbi}/python-ai:${IMAGE_TAG:-dev}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?}
      DB_USER: ${DB_USER:?}
      DB_PASS: ${DB_PASSWORD:?}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBITMQ_USER:?}
      RABBIT_PASS: ${RABBITMQ_PASSWORD:?}
      RABBIT_QUEUE: ${RABBITMQ_QUEUE_ANALYSIS:?}
      RABBIT_QUEUE_PUBLISH: ${RABBITMQ_QUEUE_FINISHED:?}
      API_KEY: ${FACE_RECOG_API_KEY:?}
      RUN_SYNC_AT_STARTUP: ${RUN_SYNC_AT_STARTUP:-false}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-50}
      # Fara ":" intentionat: nesetat = 100, gol = fara limita
      SYNC_MAX_PERSONS: ${SYNC_MAX_PERSONS-100}
      SYNC_DELAY_MS: ${SYNC_DELAY_MS:-200}
      # Gol = default-ul din main.py (doar persoanele cautate); "*" = toate afisele
      SYNC_INCLUDE_CLASSIFICATIONS: ${SYNC_INCLUDE_CLASSIFICATIONS:-}
      IMAGE_MAX_SIDE: ${IMAGE_MAX_SIDE:-1280}
      # Doar in dev (overlay); in prod pozele se descarca direct de la https://${DOMAIN}
      IMAGE_URL_REWRITE: ""
      # Indexul facial pe volum persistent. Lipsa = index gol; se construieste
      # cu scripts/sync-faces.sh --full dupa primul import FBI.
      FACE_INDEX_PATH: /data/face-index/fbi_vectors.pkl
    volumes:
      - face_index:/data/face-index
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 5
      # Importul TensorFlow e lent. Cu RUN_SYNC_AT_STARTUP=true containerul devine
      # healthy abia dupa sync (zeci de minute); scripts/sync-faces.sh asteapta logul.
      start_period: 180s

  # --------------------------------------------------------------------------
  # File API (upload -> MinIO). URL-ul public al fisierelor vine din overlay.
  # --------------------------------------------------------------------------
  file-api:
    image: ${IMAGE_PREFIX:-fbi}/file-api:${IMAGE_TAG:-dev}
    environment:
      AppPort: "7005"
      Minio__Url: http://minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:?}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?}
      Minio__Bucketname: ${MINIO_BUCKET:?}
      ApiKey: ${API_KEY_SHARED:?}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7005/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # Nginx - imagine proprie (nginx/Dockerfile): snippets + reload periodic.
  # Template-urile NU sunt in imagine: pe VPS vin din checkout-ul git.
  # Config-ul vine din nginx/templates/<mediu>/ (montat de overlay) si e
  # procesat cu envsubst de entrypoint-ul imaginii oficiale.
  # --------------------------------------------------------------------------
  nginx:
    image: ${IMAGE_PREFIX:-fbi}/nginx:${IMAGE_TAG:-dev}
    environment:
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-20m}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      file-api:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  face_index:
