# Protectii pentru /files/ (obiecte publice din bucket-ul MinIO, urcate de
# utilizatori). $files_disposition e definit cu map in template:
# imaginile (fara SVG) se afiseaza inline, orice altceva se descarca.
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Disposition $files_disposition always;
# Un eventual HTML/SVG deschis direct ruleaza intr-un sandbox fara scripturi
add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
proxy_hide_header Content-Disposition;
