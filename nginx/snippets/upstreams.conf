# Rezolvare DNS dinamica prin DNS-ul intern Docker (127.0.0.11).
# proxy_pass foloseste variabile, deci numele serviciilor se rezolva la
# request (cache 10s), nu doar la pornire/reload. Astfel, cand un container
# e recreat sau repornit de restart policy si primeste alt IP, nginx il
# gaseste singur in max. 10s, fara 502 permanente.
#
# Reguli pentru proxy_pass cu variabile (vezi docs/architecture.md):
#   - variabila contine DOAR schema://host:port, fara URI
#     -> nginx trimite URI-ul original neschimbat (/api/..., /realms/...)
#   - pentru a schimba path-ul (ex. /files/x -> /x) se foloseste
#     `rewrite ... break;` inainte de proxy_pass, NU un URI in proxy_pass
#     (cu variabile, un URI in proxy_pass inlocuieste tot URI-ul cererii).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
